<!doctype html><html lang="es"><meta charset="utf-8"><title>Generador de fixture QA</title><body><h1>Fixture local de video QA</h1><canvas id="frame" width="320" height="180"></canvas><button id="record">Generar video de prueba</button><p id="status">Listo</p><script>
const canvas=document.getElementById('frame'), ctx=canvas.getContext('2d');
function draw(t){ctx.fillStyle='#12262b';ctx.fillRect(0,0,320,180);ctx.fillStyle='#4ac0cb';ctx.fillRect(20+(t%180),70,30,30);ctx.fillStyle='white';ctx.font='20px sans-serif';ctx.fillText('Video QA local',20,35)} draw(0);
document.getElementById('record').onclick=()=>{const stream=canvas.captureStream(15);const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8'}), chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{clearInterval(timer);stream.getTracks().forEach(t=>t.stop());const a=document.createElement('a');a.textContent='Descargar video QA';a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='qa-video.webm';document.body.append(a);document.getElementById('status').textContent='Video generado';};const timer=setInterval(()=>draw(Date.now()/10),66);rec.start();document.getElementById('status').textContent='Grabando fixture';setTimeout(()=>rec.stop(),2000);};
</script></body></html>
